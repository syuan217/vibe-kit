# 校验插件结构;打 tag(v*)时自动打包 vibe-kit.plugin 并附到 GitHub Release
name: plugin-release
on:
  pull_request:
    # 校验读的文件都要列进来,否则「只改 VERSION」这类 PR 会静默跳过校验
    paths:
      - "plugin/**"
      - "prompts/**"
      - ".claude-plugin/**"
      - "VERSION"
      - "CHANGELOG.md"
      - "README.md"
      - "scripts/vibe-release.py"
      - "scripts/sync-prompts.py"
      - ".github/workflows/plugin-release.yml"
  push:
    tags: ["v*"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # 下面两条与 AGENTS.md「提交前本地校验」是同一组命令,CI 不内联任何额外规则
      - name: Validate versions, manifests & skill roster
        # 七处版本一致 + 清单/frontmatter 结构 + skill 名册与数量,逻辑唯一来源是 scripts/vibe-release.py
        run: python3 scripts/vibe-release.py check
      - name: Check prompts are in sync with skills
        # prompts/ 与应用模板副本由 SKILL.md 生成,防手工同步漂移
        run: python3 scripts/sync-prompts.py --check
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Package plugin
        run: cd plugin && zip -r ../vibe-kit.plugin . -x "*.DS_Store"
      - name: Create release with artifact
        uses: softprops/action-gh-release@v2
        with:
          files: vibe-kit.plugin
          generate_release_notes: true
