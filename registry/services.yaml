# 服务注册表 — 全系统唯一权威的服务清单与关系(schema v3)
# 两类关系各有归处:
#   - 点对点调用(REST / RPC / 跨库) → services[].depends_on(via 记具体方式)
#   - MQ 发布/订阅                   → topics[](producers/consumers)
# 关系单一来源:服务条目不镜像 produces/consumes,MQ 关系只在 topics[] 维护。
# 粒度是**服务级**:只记"谁依赖谁、用什么方式",不记具体接口——接口在实施阶段读代码发现。
# AI 处理跨应用需求时先读本文件,图遍历得出影响面;各服务要做什么看 boundary。
# 以下为示例,替换为真实服务。
version: 3

services:
  - id: order-service
    repo: https://github.com/your-org/order-service
    owner: yinn
    description: 订单核心服务
    boundary: |
      负责订单生命周期(创建、支付回调、状态流转)。
      不负责:库存扣减(inventory-service)、履约(fulfillment-service)。
    docs:
      agents: AGENTS.md               # 路径相对各自仓库根目录
      architecture: docs/architecture.md
      api: docs/api.md
    depends_on:                       # 点对点调用;MQ 关系走 topics[]
      - id: user-service
        via: Dubbo                    # REST | DB | Dubbo | SOFA | gRPC | Feign
        contract: user-service:docs/api.md   # 指到对端契约文档,不抄接口签名
        status: active                # active(默认,已生效)| planned(契约定稿未上线)
        spec: "001"

  - id: user-service
    repo: https://github.com/your-org/user-service
    owner: teammate
    description: 用户与鉴权服务
    boundary: |
      负责用户资料、登录鉴权、权限。
      不负责:订单、支付。
    docs:
      agents: AGENTS.md
      architecture: docs/architecture.md
      api: docs/api.md
    depends_on: []

  - id: inventory-service
    repo: https://github.com/your-org/inventory-service
    owner: teammate
    description: 库存服务
    boundary: |
      负责 SKU 库存扣减、回补、库存查询。
      不负责:订单状态、履约。
    docs:
      agents: AGENTS.md
      architecture: docs/architecture.md
      api: docs/api.md
    depends_on: []

  - id: notification-service
    repo: https://github.com/your-org/notification-service
    owner: teammate
    description: 通知服务
    boundary: |
      负责站内信、短信、推送的发送。
      不负责:通知内容的业务判定(由各业务方决定发不发)。
    docs:
      agents: AGENTS.md
      architecture: docs/architecture.md
      api: docs/api.md
    depends_on: []

# ── MQ topic:一等实体,天然表达"一产多消"(order.created 被库存与通知同时消费) ──
topics:
  - name: order.created
    owner: order-service              # schema 归属(契约定义方)
    contract: order-service:docs/events/order-created.md
    producers: [order-service]
    consumers: [inventory-service, notification-service]
    status: active
    spec: "001"
